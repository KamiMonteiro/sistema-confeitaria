<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Produto — Rosas & Tortas Confeitaria</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/js/all.min.js" defer></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            rose: { DEFAULT:'#F4A7B9', light:'#FAD4DE', dark:'#E8789A', deep:'#C9546E' },
            mint: { DEFAULT:'#A8D5BA', light:'#D4EDE0', dark:'#6FBA96', deep:'#4A9B72' },
          },
          fontFamily: { display: ['Playfair Display','serif'] },
        }
      }
    }
  </script>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/styles.css">
  <style>
    .form-label { display:block; font-size:.75rem; font-weight:500; color:#6b7280; margin-bottom:.375rem; }
    .form-erro  { font-size:.7rem; color:#ef4444; margin-top:.25rem; display:block; min-height:1rem; }
    .form-input.invalid { border-color:#fca5a5; box-shadow:0 0 0 2px rgba(252,165,165,.3); }
  </style>
</head>
<body class="petal-bg" data-page="produtos">

<div class="page-layout">

  <!-- ── SIDEBAR ── -->
  <aside class="sidebar">
    <div class="sidebar-brand">
      <span style="font-size:1.5rem;">🌹</span>
      <div>
        <p class="font-display" style="font-size:.875rem;font-weight:600;color:#1f2937;line-height:1.2;">Rosas & Tortas</p>
        <p style="font-size:.7rem;color:#d1d5db;">Confeitaria</p>
      </div>
    </div>
    <p class="sidebar-label">Menu</p>
    <a class="nav-item" data-nav="dashboard"  href="dashboard.html"><i class="fa-solid fa-house-chimney icon"></i> Dashboard</a>
    <a class="nav-item" data-nav="produtos"   href="produtos-lista.html"><i class="fa-solid fa-cake-candles icon"></i> Produtos</a>
    <a class="nav-item" data-nav="clientes"   href="clientes-lista.html"><i class="fa-solid fa-users icon"></i> Clientes</a>
    <a class="nav-item" data-nav="pedidos"    href="pedidos-lista.html"><i class="fa-solid fa-bag-shopping icon"></i> Pedidos</a>
    <a class="nav-item" data-nav="pagamentos" href="pagamentos-lista.html"><i class="fa-solid fa-credit-card icon"></i> Formas de Pagamento</a>
    <a class="nav-item" data-nav="usuarios"   href="usuarios-lista.html"><i class="fa-solid fa-user-shield icon"></i> Usuários</a>
    <div style="flex:1;"></div>
    <div style="border-top:1px solid #FFF0F4;padding-top:.75rem;margin-top:.75rem;">
      <div style="display:flex;align-items:center;gap:.625rem;padding:.5rem;">
        <div id="sidebar-avatar" style="width:1.75rem;height:1.75rem;border-radius:9999px;background:#FAD4DE;
                    display:flex;align-items:center;justify-content:center;
                    font-size:.75rem;font-weight:700;color:#C9546E;">?</div>
        <div>
          <p style="font-size:.75rem;font-weight:500;color:#374151;" id="sidebar-usuario">—</p>
          <p style="font-size:.7rem;color:#d1d5db;" id="sidebar-email">—</p>
        </div>
      </div>
      <a class="nav-item" href="login.html" style="color:#9ca3af;margin-top:.25rem;">
        <i class="fa-solid fa-right-from-bracket icon"></i> Sair
      </a>
    </div>
  </aside>

  <!-- ── CONTEÚDO ── -->
  <main class="page-main">

    <!-- Breadcrumb -->
    <div class="fade-up" style="display:flex;align-items:center;gap:.5rem;font-size:.875rem;color:#9ca3af;margin-bottom:1.5rem;">
      <a href="produtos-lista.html" style="color:#9ca3af;text-decoration:none;transition:color .2s;"
         onmouseover="this.style.color='#C9546E'" onmouseout="this.style.color='#9ca3af'">Produtos</a>
      <i class="fa-solid fa-chevron-right" style="font-size:.625rem;"></i>
      <span style="color:#374151;font-weight:500;" id="breadcrumb-titulo">Novo produto</span>
    </div>

    <!-- Cabeçalho -->
    <div class="fade-up" style="display:flex;align-items:center;justify-content:space-between;margin-bottom:1.5rem;">
      <h2 class="font-display" style="font-size:1.5rem;font-weight:600;color:#1f2937;" id="page-titulo">
        Novo produto
      </h2>
      <a href="produtos-lista.html" class="btn-secondary">
        <i class="fa-solid fa-arrow-left"></i> Voltar
      </a>
    </div>

    <div class="card fade-up delay-1" style="max-width:680px;">
      <input type="hidden" id="f-id">

      <p style="font-size:.8rem;font-weight:600;color:#9ca3af;text-transform:uppercase;
         letter-spacing:.06em;margin-bottom:1.25rem;">
        <i class="fa-solid fa-cake-candles" style="margin-right:.375rem;"></i>Dados do produto
      </p>

      <div style="display:grid;grid-template-columns:1fr 1fr;gap:1.25rem;">
        <div style="grid-column:1/-1;">
          <label class="form-label">Nome <span style="color:#C9546E;">*</span></label>
          <input type="text" id="f-nome" placeholder="Ex: Torta de Morango" class="form-input">
          <span class="form-erro" id="err-nome"></span>
        </div>

        <div>
          <label class="form-label">Preço unitário (R$) <span style="color:#C9546E;">*</span></label>
          <div style="position:relative;">
            <span style="position:absolute;left:.75rem;top:50%;transform:translateY(-50%);
                         font-size:.875rem;color:#9ca3af;">R$</span>
            <input type="number" id="f-preco" placeholder="0,00" step="0.01" min="0"
                   class="form-input" style="padding-left:2.5rem;">
          </div>
          <span class="form-erro" id="err-preco"></span>
        </div>

        <div>
          <label class="form-label">Categoria</label>
          <select id="f-categoria" class="form-input">
            <option value="">Selecione...</option>
            <option>Bolos</option>
            <option>Tortas</option>
            <option>Doces</option>
            <option>Salgados</option>
            <option>Bebidas</option>
            <option>Outros</option>
          </select>
        </div>

        <div style="grid-column:1/-1;">
          <label class="form-label">Descrição</label>
          <textarea id="f-descricao" rows="3" placeholder="Descreva o produto..."
                    class="form-input" style="resize:vertical;"></textarea>
        </div>

        <div>
          <label class="form-label">Status</label>
          <select id="f-ativo" class="form-input">
            <option value="SIM">Ativo</option>
            <option value="NAO">Inativo</option>
          </select>
        </div>
      </div>

      <div style="display:flex;justify-content:space-between;align-items:center;gap:.75rem;margin-top:2rem;
                  padding-top:1.5rem;border-top:1px solid #FFF0F4;">
        <a href="produtos-lista.html" class="btn-secondary">Cancelar</a>
        <button class="btn-primary" onclick="salvar()">
          <i class="fa-solid fa-floppy-disk"></i> Salvar produto
        </button>
        <span id="salvando" style="font-size:.75rem;color:#9ca3af;display:none;">
          <i class="fa-solid fa-spinner fa-spin"></i> Salvando...
        </span>
      </div>
    </div>
  </main>
</div>

<!-- Toast -->
<div id="toast" class="toast hidden">
  <i id="toast-icon" class="fa-solid fa-circle-check" style="color:#4A9B72;"></i>
  <span id="toast-msg">Operação realizada!</span>
</div>

<script src="../js/app.js"></script>
<script>
  const params = new URLSearchParams(window.location.search);
  const modo = params.get('modo');
  const id = params.get('id');

  if (modo === 'editar') {
    document.getElementById('page-titulo').textContent = 'Editar produto';
    document.getElementById('breadcrumb-titulo').textContent = 'Editar produto';
    document.title = 'Editar Produto — Rosas & Tortas';
    carregarProduto(id);
  }

  async function carregarProduto(produtoId) {
    if (!produtoId) return;
    try {
      const res = await fetch(`http://localhost:8080/api/produto/listar/${produtoId}`);
      if (!res.ok) { showToast('Não foi possível carregar o produto.', 'erro'); return; }
      const p = await res.json();
      document.getElementById('f-id').value        = p.id_produto;
      document.getElementById('f-nome').value      = p.nome;
      document.getElementById('f-preco').value     = p.preco_unitario;
      document.getElementById('f-categoria').value = p.categoria;
      document.getElementById('f-descricao').value = p.descricao;
      document.getElementById('f-ativo').value     = p.ativo === 'S' ? 'SIM' : 'NAO';
    } catch {
      showToast('Erro ao buscar produto.', 'erro');
    }
  }

  function validar() {
    let ok = true;
    const nome  = document.getElementById('f-nome');
    const preco = document.getElementById('f-preco');
    if (!nome.value.trim()) {
      nome.classList.add('invalid');
      document.getElementById('err-nome').textContent = 'Informe o nome do produto.';
      ok = false;
    } else {
      nome.classList.remove('invalid');
      document.getElementById('err-nome').textContent = '';
    }
    if (!preco.value || parseFloat(preco.value) <= 0) {
      preco.classList.add('invalid');
      document.getElementById('err-preco').textContent = 'Informe um preço válido.';
      ok = false;
    } else {
      preco.classList.remove('invalid');
      document.getElementById('err-preco').textContent = '';
    }
    return ok;
  }

  async function salvar() {
    if (!validar()) return;
    document.getElementById('salvando').style.display = 'inline-flex';

    const payload = {
      id_produto:     parseInt(document.getElementById('f-id').value) || 0,
      nome:           document.getElementById('f-nome').value.trim(),
      preco_unitario: parseFloat(document.getElementById('f-preco').value),
      categoria:      document.getElementById('f-categoria').value,
      descricao:      document.getElementById('f-descricao').value.trim(),
      ativo:          document.getElementById('f-ativo').value,
    };

    const url    = modo === 'editar' ? 'http://localhost:8080/api/atualizar/produto' : 'http://localhost:8080/api/novo/produto';
    const method = modo === 'editar' ? 'PUT' : 'POST';

    try {
      const res = await fetch(url, { method, headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
      document.getElementById('salvando').style.display = 'none';
      if (!res.ok) { showToast('Erro ao salvar produto.', 'erro'); return; }
      showToast(modo === 'editar' ? 'Produto atualizado!' : 'Produto cadastrado!');
      window.location.href = 'produtos-lista.html';
    } catch {
      document.getElementById('salvando').style.display = 'none';
      showToast('Erro de conexão com o backend.', 'erro');
    }
  }
</script>
</body>
</html>
