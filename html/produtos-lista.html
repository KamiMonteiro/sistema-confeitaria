<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Produtos — Rosas & Tortas Confeitaria</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/js/all.min.js" defer></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            rose: { DEFAULT:'#F4A7B9', light:'#FAD4DE', dark:'#E8789A', deep:'#C9546E' },
            mint: { DEFAULT:'#A8D5BA', light:'#D4EDE0', dark:'#6FBA96', deep:'#4A9B72' },
          },
          fontFamily: { display: ['Playfair Display','serif'] },
          boxShadow: {
            soft: '0 2px 16px rgba(244,167,185,0.15)',
            card: '0 4px 24px rgba(200,120,140,0.10)',
          }
        }
      }
    }
  </script>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/styles.css">
</head>
<body class="petal-bg" data-page="produtos">

<div class="page-layout">

  <!-- ── SIDEBAR ── -->
  <aside class="sidebar">
    <div class="sidebar-brand">
      <span style="font-size:1.5rem;">🌹</span>
      <div>
        <p class="font-display" style="font-size:.875rem;font-weight:600;color:#1f2937;line-height:1.2;">Rosas & Tortas</p>
        <p style="font-size:.7rem;color:#d1d5db;">Confeitaria</p>
      </div>
    </div>
    <p class="sidebar-label">Menu</p>
    <a class="nav-item" data-nav="dashboard"  href="dashboard.html"><i class="fa-solid fa-house-chimney icon"></i> Dashboard</a>
    <a class="nav-item" data-nav="produtos"   href="produtos-lista.html"><i class="fa-solid fa-cake-candles icon"></i> Produtos</a>
    <a class="nav-item" data-nav="clientes"   href="clientes-lista.html"><i class="fa-solid fa-users icon"></i> Clientes</a>
    <a class="nav-item" data-nav="pedidos"    href="pedidos-lista.html"><i class="fa-solid fa-bag-shopping icon"></i> Pedidos</a>
    <a class="nav-item" data-nav="pagamentos" href="pagamentos-lista.html"><i class="fa-solid fa-credit-card icon"></i> Formas de Pagamento</a>
    <a class="nav-item" data-nav="usuarios"   href="usuarios-lista.html"><i class="fa-solid fa-user-shield icon"></i> Usuários</a>
    <div style="flex:1;"></div>
    <div style="border-top:1px solid #FFF0F4;padding-top:.75rem;margin-top:.75rem;">
      <div style="display:flex;align-items:center;gap:.625rem;padding:.5rem;">
        <div id="sidebar-avatar" style="width:1.75rem;height:1.75rem;border-radius:9999px;background:#FAD4DE;
                    display:flex;align-items:center;justify-content:center;
                    font-size:.75rem;font-weight:700;color:#C9546E;">?</div>
        <div>
          <p style="font-size:.75rem;font-weight:500;color:#374151;" id="sidebar-usuario">—</p>
          <p style="font-size:.7rem;color:#d1d5db;" id="sidebar-email">—</p>
        </div>
      </div>
      <a class="nav-item" href="login.html" style="color:#9ca3af;margin-top:.25rem;">
        <i class="fa-solid fa-right-from-bracket icon"></i> Sair
      </a>
    </div>
  </aside>

  <!-- ── CONTEÚDO ── -->
  <main class="page-main">

    <!-- Header -->
    <div class="fade-up" style="display:flex;align-items:center;justify-content:space-between;margin-bottom:1.5rem;">
      <div>
        <h2 class="font-display" style="font-size:1.5rem;font-weight:600;color:#1f2937;">Produtos</h2>
        <p style="font-size:.875rem;color:#9ca3af;margin-top:.25rem;">Gerencie o catálogo da confeitaria</p>
      </div>
      <a class="btn-primary" href="produto-form.html?modo=novo">
        <i class="fa-solid fa-plus"></i> Novo produto
      </a>
    </div>

    <!-- Filtros -->
    <div class="card fade-up delay-1"
         style="display:flex;flex-wrap:wrap;gap:.75rem;align-items:center;margin-bottom:1.25rem;padding:1rem;">
      <input id="filtro-nome" type="text" placeholder="🔍  Buscar por nome..." class="form-input"
             style="max-width:220px;">
      <select id="filtro-cat" class="form-input" style="max-width:170px;">
        <option value="">Todas categorias</option>
        <option>Bolos</option>
        <option>Tortas</option>
        <option>Doces</option>
        <option>Salgados</option>
        <option>Bebidas</option>
        <option>Outros</option>
      </select>
      <select id="filtro-ativo" class="form-input" style="max-width:130px;">
        <option value="">Status</option>
        <option value="S">Ativo</option>
        <option value="N">Inativo</option>
      </select>
      <button class="btn-mint" onclick="buscar()">
        <i class="fa-solid fa-magnifying-glass"></i> Buscar
      </button>
      <button class="btn-secondary" onclick="mostrarTodos()">
        <i class="fa-solid fa-list"></i> Mostrar todos
      </button>
    </div>

    <!-- Tabela -->
    <div class="card fade-up delay-2" style="padding:0;overflow:hidden;">
      <table class="tbl">
        <thead>
          <tr>
            <th>ID</th>
            <th>Nome</th>
            <th>Categoria</th>
            <th>Preço Unit.</th>
            <th>Status</th>
            <th style="text-align:center;">Ações</th>
          </tr>
        </thead>
        <tbody id="tbody-produtos"></tbody>
      </table>

      <div style="display:flex;align-items:center;justify-content:space-between;
                  padding:.75rem 1rem;border-top:1px solid #FFF0F4;font-size:.75rem;color:#9ca3af;">
        <span id="pag-info"></span>
        <div id="pag-botoes" style="display:flex;gap:.25rem;"></div>
      </div>
    </div>

  </main>
</div>

<!-- Modal exclusão -->
<div id="modal-excluir" class="modal-overlay hidden">
  <div class="modal-box">
    <div style="width:3.5rem;height:3.5rem;border-radius:1rem;background:#FAD4DE;
                display:flex;align-items:center;justify-content:center;margin:0 auto 1rem;">
      <i class="fa-solid fa-trash-can" style="font-size:1.25rem;color:#C9546E;"></i>
    </div>
    <h3 class="font-display" style="font-size:1.125rem;font-weight:600;color:#1f2937;margin-bottom:.5rem;">
      Excluir produto <span id="modal-produto-nome" style="font-weight:700;color:#C9546E;"></span>?
    </h3>
    <p style="font-size:.875rem;color:#9ca3af;margin-bottom:1.5rem;">Esta ação não pode ser desfeita.</p>
    <div style="display:flex;gap:.75rem;justify-content:center;">
      <button class="btn-secondary" onclick="fecharModal('modal-excluir')">Cancelar</button>
      <button class="btn-danger" onclick="confirmarExclusao()">
        <i class="fa-solid fa-trash-can"></i> Sim
      </button>
    </div>
  </div>
</div>

<!-- Toast -->
<div id="toast" class="toast hidden">
  <i id="toast-icon" class="fa-solid fa-circle-check" style="color:#4A9B72;"></i>
  <span id="toast-msg">Operação realizada!</span>
</div>

<script src="../js/app.js"></script>
<script>
  const POR_PAGINA = 10;
  let paginaAtual = 1;
  let produtos = [];
  let produtosFiltrados = [];
  let idParaExcluir = null;

  async function carregarProdutos() {
    const res = await fetch('http://localhost:8080/api/todos/produto');
    produtos = await res.json() || [];
    produtosFiltrados = [...produtos];
    renderTabela(produtosFiltrados);
  }

  carregarProdutos();

  function renderTabela(lista) {
    const inicio = (paginaAtual - 1) * POR_PAGINA;
    const pagina = lista.slice(inicio, inicio + POR_PAGINA);

    document.getElementById('tbody-produtos').innerHTML = pagina.map(p => {
      const ativo = p.ativo === 'S';
      return `
      <tr>
        <td style="color:#9ca3af;">#${p.id_produto}</td>
        <td style="font-weight:500;color:#1f2937;">${p.nome}</td>
        <td><span class="badge badge-rose">${p.categoria || '—'}</span></td>
        <td style="font-weight:500;color:#1f2937;">${formatarMoeda(p.preco_unitario)}</td>
        <td>
          <span class="badge ${ativo ? 'badge-green' : 'badge-gray'}">
            ${ativo ? 'Ativo' : 'Inativo'}
          </span>
        </td>
        <td style="text-align:center;">
          <div style="display:inline-flex;gap:.25rem;">
            <a href="produto-form.html?modo=editar&id=${p.id_produto}"
               style="display:inline-flex;align-items:center;justify-content:center;
                      width:2rem;height:2rem;border-radius:.5rem;color:#E8789A;
                      background:transparent;border:none;cursor:pointer;text-decoration:none;transition:background .2s;"
               onmouseover="this.style.background='#FAD4DE'" onmouseout="this.style.background='transparent'"
               title="Editar">
              <i class="fa-solid fa-pen-to-square" style="font-size:.875rem;"></i>
            </a>
            <button onclick="pedirExclusao(${p.id_produto}, ${JSON.stringify(p.nome)})"
                    style="display:inline-flex;align-items:center;justify-content:center;
                           width:2rem;height:2rem;border-radius:.5rem;color:#d1d5db;
                           background:transparent;border:none;cursor:pointer;transition:all .2s;"
                    onmouseover="this.style.background='#fee2e2';this.style.color='#ef4444'"
                    onmouseout="this.style.background='transparent';this.style.color='#d1d5db'"
                    title="Excluir">
              <i class="fa-solid fa-trash-can" style="font-size:.875rem;"></i>
            </button>
          </div>
        </td>
      </tr>`;
    }).join('') || '<tr><td colspan="6" style="text-align:center;color:#9ca3af;padding:2rem;">Nenhum produto encontrado.</td></tr>';

    const total = lista.length;
    const paginas = Math.max(1, Math.ceil(total / POR_PAGINA));
    document.getElementById('pag-info').textContent =
      `Mostrando ${Math.min(inicio + 1, total)}–${Math.min(inicio + POR_PAGINA, total)} de ${total} registros`;

    const botoes = document.getElementById('pag-botoes');
    botoes.innerHTML = '';
    for (let i = 1; i <= paginas; i++) {
      const btn = document.createElement('button');
      btn.textContent = i;
      btn.style.cssText = `padding:.25rem .625rem;border-radius:.5rem;font-size:.75rem;border:none;cursor:pointer;
                           background:${i === paginaAtual ? '#FAD4DE' : 'transparent'};
                           color:${i === paginaAtual ? '#C9546E' : '#9ca3af'};
                           font-weight:${i === paginaAtual ? '600' : '400'};`;
      btn.onclick = () => { paginaAtual = i; renderTabela(produtosFiltrados); };
      botoes.appendChild(btn);
    }
  }

  async function buscar() {
    const texto = document.getElementById('filtro-nome').value.trim();
    const cat   = document.getElementById('filtro-cat').value;
    const ativo = document.getElementById('filtro-ativo').value;

    if (texto) {
      const res = await fetch(`http://localhost:8080/api/produto/buscar?nome=${encodeURIComponent(texto)}`);
      produtosFiltrados = await res.json() || [];
    } else {
      produtosFiltrados = [...produtos];
    }

    // Filtros locais
    if (cat)   produtosFiltrados = produtosFiltrados.filter(p => p.categoria === cat);
    if (ativo) produtosFiltrados = produtosFiltrados.filter(p => p.ativo === ativo);

    paginaAtual = 1;
    renderTabela(produtosFiltrados);
  }

  function mostrarTodos() {
    document.getElementById('filtro-nome').value  = '';
    document.getElementById('filtro-cat').value   = '';
    document.getElementById('filtro-ativo').value = '';
    produtosFiltrados = [...produtos];
    paginaAtual = 1;
    renderTabela(produtosFiltrados);
  }

  function pedirExclusao(id, nome) {
    idParaExcluir = id;
    document.getElementById('modal-produto-nome').textContent = nome;
    abrirModal('modal-excluir');
  }

  async function confirmarExclusao() {
    fecharModal('modal-excluir');
    const res = await fetch(`http://localhost:8080/api/produto/excluir/${idParaExcluir}`, { method: 'DELETE' });
    if (!res.ok) { showToast('Erro ao excluir produto.', 'erro'); return; }
    produtos = produtos.filter(p => p.id_produto !== idParaExcluir);
    produtosFiltrados = produtosFiltrados.filter(p => p.id_produto !== idParaExcluir);
    renderTabela(produtosFiltrados);
    showToast('Produto excluído com sucesso.');
  }
</script>
</body>
</html>
